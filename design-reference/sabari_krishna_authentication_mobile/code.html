<!-- Script for Mock Interaction -->
<script>
        function transitionToOtp() {
            const phoneStep = document.getElementById('step-phone');
            const otpStep = document.getElementById('step-otp');
            
            phoneStep.classList.add('opacity-0', '-translate-x-10');
            setTimeout(() => {
                phoneStep.classList.add('hidden');
                otpStep.classList.remove('hidden');
                otpStep.classList.remove('opacity-0', 'translate-x-10');
                otpStep.classList.add('opacity-100', 'translate-x-0');
                
                // Focus first OTP field
                document.querySelector('.otp-input').focus();
            }, 300);
        }

        function transitionToPhone() {
            const phoneStep = document.getElementById('step-phone');
            const otpStep = document.getElementById('step-otp');
            
            otpStep.classList.add('opacity-0', 'translate-x-10');
            setTimeout(() => {
                otpStep.classList.add('hidden');
                phoneStep.classList.remove('hidden');
                phoneStep.classList.remove('opacity-0', '-translate-x-10');
                phoneStep.classList.add('opacity-100', 'translate-x-0');
            }, 300);
        }

        // Auto-focus logic for OTP inputs
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
